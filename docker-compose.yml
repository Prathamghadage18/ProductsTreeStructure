version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: sensor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sensor_db}
      POSTGRES_USER: ${DB_USER:-sensor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sensor_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Removed ports mapping to avoid exposing DB externally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sensor_user} -d ${DB_NAME:-sensor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensor_network

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Tree_backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn --config gunicorn.conf.py server.wsgi:application"
    environment:
      # Django settings
      DJANGO_SETTINGS_MODULE: server.settings
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-to-a-secure-random-string}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx}
      
      # Database configuration
      DB_NAME: ${DB_NAME:-sensor_db}
      DB_USER: ${DB_USER:-sensor_user}
      DB_PASSWORD: ${DB_PASSWORD:-sensor_password}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
      
      # Security settings
      USE_PROD_SECURITY: ${USE_PROD_SECURITY:-False}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      
      # CORS settings
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      
      # Gunicorn settings
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Application settings
      ALLOWED_EXCEL_DIRS: ${ALLOWED_EXCEL_DIRS:-}
      EXCEL_DEFAULT_PATH: ${EXCEL_DEFAULT_PATH:-}
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
      - ./tmp_uploads:/app/tmp_uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sensor_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: sensor_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sensor_network

networks:
  sensor_network:
    driver: bridge
    name: sensor_network

volumes:
  postgres_data:
    name: sensor_postgres_data
  nginx_logs:
    name: sensor_nginx_logs
